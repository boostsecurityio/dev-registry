api_version: 1.0

id: boostsecurityio/trivy-sbom-image
name: Trivy (Image SBOM)
namespace: boostsecurityio/trivy-sbom-image
scan_types:
  - sbom

config:
  support_diff_scan: false

setup:
  - name: download trivy
    environment:
      VERSION: 0.69.2
      LINUX_X86_64_SHA: 65b5755bbc851699be0286b453b51c3b1f139a8c1ce731f444210eeaf9a1aa61
      LINUX_ARM64_SHA: 524e496954c761ce5cd9c92baf2f7c2180958015bc25edad31570e102592a37c
      MACOS_ARM64_SHA: 28243bee903a5e00fe9074baeb9e57c51ae05514261a53da66ef7f2cc0b352f9
    run: |
      BINARY_URL="https://assets.build.boostsecurity.io/scanners/trivy/trivy-${VERSION}"
      ARCH=$(uname -m)

      case "$(uname -sm)" in
        "Linux x86_64")
          BINARY_URL="${BINARY_URL}/linux/amd64/trivy.gz"
          SHA="${LINUX_X86_64_SHA} trivy.gz"
          ;;
        "Linux aarch64")
          BINARY_URL="${BINARY_URL}/linux/arm64/trivy.gz"
          SHA="${LINUX_ARM64_SHA} trivy.gz"
          ;;
        "Darwin arm64")
          BINARY_URL="${BINARY_URL}/darwin/arm64/trivy.gz"
          SHA="${MACOS_ARM64_SHA} trivy.gz"
          ;;
        *)
          echo "Unsupported machine: ${OPTARG}"
          exit 1
          ;;
      esac

      curl -o trivy.gz -fsSL "${BINARY_URL}"
      echo "${SHA}" | sha256sum --check

      gunzip trivy.gz
      chmod +x trivy

steps:
  - scan:
      command:
        environment:
          IMAGE_NAME: ${BOOST_IMAGE_NAME}
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
          TRIVY_ADDITIONAL_ARGS: ${TRIVY_ADDITIONAL_ARGS:-}
          TRIVY_CACHE_DIR: ${TRIVY_CACHE_DIR:-/tmp/trivy/}
          SCANNER_REPORT_PATH: ${SCANNER_REPORT_PATH:-report.cdx.json}
          SCANNER_LOGS: ${SCANNER_LOGS:-scanner.log}
        run: |
          $SETUP_PATH/trivy image ${TRIVY_ADDITIONAL_ARGS} \
                               --no-progress \
                               --skip-version-check \
                               --debug \
                               --format cyclonedx \
                               --license-full \
                               --output ${SCANNER_REPORT_PATH} \
                               ${BOOST_IMAGE_NAME} > ${SCANNER_LOGS} 2>&1 && exit_code=$? || exit_code=$?
          if [ "$exit_code" != "0" ]
          then 
              cat ${SCANNER_LOGS}
              exit 0
          fi
          cat ${SCANNER_REPORT_PATH}
      format: cyclonedx
      post-processor:
        docker:
          image: public.ecr.aws/boostsecurityio/boost-scanner-trivy-sbom:9b693ef@sha256:249ee707158424d8bd333198e1512ca295fe30c6fff2d2b1adff9e8f914b42cb
          command: process
          environment:
            PYTHONIOENCODING: utf-8
