api_version: 1.0

id: boostsecurityio/semgrep
name: Semgrep
namespace: boostsecurityio/semgrep
scan_types:
  - sast

config:
  support_diff_scan: true
  include_files:
  - .semgrep/*

setup:
  - name: Utility scripts
    run: |
      mkdir -p $SETUP_PATH/pre-scan-checks/
      cp $REGISTRY_MODULE_PATH/prescan_checks.sh $SETUP_PATH/pre-scan-checks/semgrep

steps:
  - run: |
      $SETUP_PATH/pre-scan-checks/semgrep
    environment:
      SEMGREP_RULES: ${SEMGREP_RULES:-boost/sast/rules/semgrep@stable}
  - scan:
      command:
        docker:
          image: ghcr.io/boostsecurityio/scanner-publishing/semgrep:1.139.0@sha256:067b953b96c7d76a86efbcc5832e1c13780932417aa3248d7c67ba2a1567255c
          command: |
            semgrep scan --config ./.semgrep --oss-only --sarif --quiet --disable-version-check --metrics=off --no-git-ignore --sarif-output=$SETUP_PATH/${SCANNER_REPORT_PATH} ${SCANNER_ADDITIONAL_ARGS} ${SCANNER_FILE_LIST} || true
            code=$?
            if [ "$code" -ne 0]; then
              case "$code" in
                1)  msg="Semgrep ran successfully and found blocking findings (--error)." ;;
                2)  msg="Semgrep failed." ;;
                3)  msg="Invalid syntax of the scanned language (only reported with --strict)." ;;
                4)  msg="Semgrep encountered an invalid pattern in the rule schema." ;;
                5)  msg="Semgrep configuration is not valid YAML." ;;
                7)  msg="At least one rule in the configuration is invalid." ;;
                8)  msg="Semgrep does not understand the specified language." ;;
                13) msg="The Semgrep API key is invalid." ;;
                14) msg="Semgrep scan failure (deprecated exit code)." ;;
                99) msg="Requested functionality is not implemented in osemgrep." ;;
                *)  msg="Semgrep exited with an unrecognized error code." ;;
              esac
              echo "" >&2
              echo "Semgrep scan failed with exit code $code:$msg" >&2
              exit "$code"
            fi
            cat $SETUP_PATH/${SCANNER_REPORT_PATH}
          workdir: /src
          environment:
            XDG_CONFIG_HOME: /tmp
            HOME: /tmp
            SCANNER_FILE_LIST: ${SCANNER_FILE_LIST:-.}
            SCANNER_ADDITIONAL_ARGS: ${SCANNER_ADDITIONAL_ARGS:-}
            SCANNER_REPORT_PATH: ${SCANNER_REPORT_PATH:-}
      format: sarif
      post-processor:
        docker:
          image: ghcr.io/boostsecurityio/scanner-publishing/boost-scanner-semgrep:f27f250@sha256:1cee73b0942622296d82fcf2a85bb1e519b36fac83edb79a887d5d56dd454724
          command: process
